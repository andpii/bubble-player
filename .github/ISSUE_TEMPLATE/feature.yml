name: Suggest a feature
description: An idea that would make Bubble Player better for you.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Bubble Player to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help?
      description: The situation or site where you'd use it.
